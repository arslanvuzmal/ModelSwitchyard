<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="title desc">
  <title id="title">OmniRouter control plane</title>
  <desc id="desc">A technical map showing one request entering a policy-driven AI gateway, being evaluated and routed to one of several provider adapters while evidence is stored.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07101d"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="route" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#334155" stroke-opacity=".18"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1280" height="440" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="440" rx="24" fill="url(#grid)"/>
  <rect x="1" y="1" width="1278" height="438" rx="23" fill="none" stroke="#334155"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="64" y="70" fill="#64748b" font-size="13" letter-spacing="3">POLICY-DRIVEN AI INFRASTRUCTURE</text>
    <text x="64" y="116" fill="#f8fafc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="42" font-weight="700">One request. A governed execution path.</text>
    <text x="64" y="148" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17">Authenticate · constrain · rank · recover · normalize · explain</text>

    <g transform="translate(64 214)">
      <rect width="160" height="82" rx="12" fill="#0f172a" stroke="#334155"/>
      <circle cx="24" cy="24" r="5" fill="#22d3ee"/>
      <text x="40" y="29" fill="#e2e8f0" font-size="14" font-weight="700">REQUEST</text>
      <text x="20" y="57" fill="#64748b" font-size="12">OpenAI-shaped API</text>
    </g>

    <path d="M224 255H302" stroke="url(#route)" stroke-width="2"/>
    <circle cx="266" cy="255" r="4" fill="#22d3ee" filter="url(#glow)"/>

    <g transform="translate(302 184)">
      <rect width="420" height="184" rx="16" fill="#0b1324" stroke="#475569"/>
      <text x="24" y="34" fill="#a5b4fc" font-size="12" letter-spacing="2">OMNIROUTER</text>
      <text x="24" y="65" fill="#f8fafc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700">Routing &amp; reliability control plane</text>
      <g font-size="12">
        <rect x="24" y="92" width="78" height="34" rx="7" fill="#0f172a" stroke="#164e63"/><text x="43" y="114" fill="#67e8f9">AUTH</text>
        <rect x="112" y="92" width="78" height="34" rx="7" fill="#0f172a" stroke="#164e63"/><text x="127" y="114" fill="#67e8f9">QUOTA</text>
        <rect x="200" y="92" width="88" height="34" rx="7" fill="#0f172a" stroke="#3730a3"/><text x="218" y="114" fill="#a5b4fc">ROUTE</text>
        <rect x="298" y="92" width="98" height="34" rx="7" fill="#0f172a" stroke="#3730a3"/><text x="313" y="114" fill="#a5b4fc">RECOVER</text>
      </g>
      <path d="M24 148H396" stroke="#1e293b"/>
      <text x="24" y="169" fill="#64748b" font-size="11">eligibility → strategy → ordered fallback → evidence</text>
    </g>

    <path d="M722 255H800" stroke="url(#route)" stroke-width="2"/>
    <circle cx="760" cy="255" r="4" fill="#818cf8" filter="url(#glow)"/>

    <g transform="translate(800 184)" font-size="12">
      <rect width="180" height="46" rx="9" fill="#0f172a" stroke="#334155"/><circle cx="22" cy="23" r="5" fill="#34d399"/><text x="38" y="28" fill="#cbd5e1">Provider adapter A</text>
      <rect y="57" width="180" height="46" rx="9" fill="#0f172a" stroke="#334155"/><circle cx="22" cy="80" r="5" fill="#f59e0b"/><text x="38" y="85" fill="#cbd5e1">Provider adapter B</text>
      <rect y="114" width="180" height="46" rx="9" fill="#0f172a" stroke="#334155"/><circle cx="22" cy="137" r="5" fill="#818cf8"/><text x="38" y="142" fill="#cbd5e1">Provider adapter C</text>
    </g>

    <path d="M512 368V402H1038" fill="none" stroke="#334155" stroke-dasharray="5 6"/>
    <g transform="translate(1012 184)">
      <rect width="204" height="184" rx="16" fill="#0b1324" stroke="#334155"/>
      <text x="20" y="32" fill="#67e8f9" font-size="12" letter-spacing="2">EVIDENCE</text>
      <text x="20" y="61" fill="#cbd5e1" font-size="12">Route explanation</text>
      <text x="20" y="86" fill="#cbd5e1" font-size="12">Attempt history</text>
      <text x="20" y="111" fill="#cbd5e1" font-size="12">Failure category</text>
      <text x="20" y="136" fill="#cbd5e1" font-size="12">Usage + cost estimate</text>
      <text x="20" y="161" fill="#cbd5e1" font-size="12">Correlation ID</text>
    </g>
    <path d="M980 264H1012" stroke="#334155" stroke-dasharray="4 5"/>
  </g>
</svg>
