<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">OmniRouter model routing lifecycle</title>
  <desc id="desc">An animated technical pipeline showing authentication, quota evaluation, candidate filtering, scoring, a timeout and retry on the primary model, successful fallback, and trace persistence.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07101d"/><stop offset="1" stop-color="#0b1020"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#818cf8"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#334155" stroke-opacity=".13"/></pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .label{font:600 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:1.5px}
      .body{font:13px ui-sans-serif,system-ui,sans-serif}.mono{font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .flow{stroke-dasharray:8 8;animation:dash 1.1s linear infinite}@keyframes dash{to{stroke-dashoffset:-32}}
      @media (prefers-reduced-motion:reduce){.flow{animation:none}}
    </style>
  </defs>
  <rect width="1280" height="760" rx="24" fill="url(#bg)"/><rect width="1280" height="760" rx="24" fill="url(#grid)"/><rect x="1" y="1" width="1278" height="758" rx="23" fill="none" stroke="#334155"/>
  <g class="body">
    <text x="54" y="54" class="label" fill="#67e8f9">ROUTING LIFECYCLE · 8 SECOND LOOP</text>
    <text x="54" y="83" fill="#f8fafc" font-size="22" font-weight="700">Eligibility first. Classification before recovery. Evidence at the end.</text>

    <g transform="translate(54 118)">
      <text x="0" y="18" class="label" fill="#64748b">01 · ENTRY</text>
      <g transform="translate(0 34)"><rect width="138" height="54" rx="9" fill="#0f172a" stroke="#164e63"/><text x="69" y="33" text-anchor="middle" class="label" fill="#cffafe">REQUEST</text></g>
      <path d="M138 61H166" stroke="url(#line)" class="flow"/>
      <g transform="translate(166 34)"><rect width="138" height="54" rx="9" fill="#0f172a" stroke="#164e63"/><text x="69" y="33" text-anchor="middle" class="label" fill="#cffafe">AUTH</text></g>
      <path d="M304 61H332" stroke="url(#line)" class="flow"/>
      <g transform="translate(332 34)"><rect width="138" height="54" rx="9" fill="#0f172a" stroke="#164e63"/><text x="69" y="33" text-anchor="middle" class="label" fill="#cffafe">QUOTA</text></g>
      <path d="M470 61H498" stroke="url(#line)" class="flow"/>
      <g transform="translate(498 34)"><rect width="180" height="54" rx="9" fill="#0f172a" stroke="#3730a3"/><text x="90" y="33" text-anchor="middle" class="label" fill="#c7d2fe">CANDIDATE SET</text></g>
      <text x="712" y="68" class="mono" fill="#64748b">scope is resolved from the virtual key</text>
    </g>

    <path d="M642 224V251" stroke="#475569" class="flow"/>
    <g transform="translate(54 248)">
      <text x="0" y="18" class="label" fill="#64748b">02 · ELIGIBILITY</text>
      <g transform="translate(0 35)"><rect width="270" height="62" rx="10" fill="#0f172a" stroke="#7f1d1d"/><text x="18" y="27" class="label" fill="#fecaca">MODEL A</text><text x="18" y="47" class="mono" fill="#f87171">REJECT · missing_capability</text></g>
      <g transform="translate(290 35)"><rect width="250" height="62" rx="10" fill="#0f172a" stroke="#065f46"/><text x="18" y="27" class="label" fill="#d1fae5">MODEL B</text><text x="18" y="47" class="mono" fill="#34d399">ELIGIBLE</text></g>
      <g transform="translate(560 35)"><rect width="250" height="62" rx="10" fill="#0f172a" stroke="#065f46"/><text x="18" y="27" class="label" fill="#d1fae5">MODEL C</text><text x="18" y="47" class="mono" fill="#34d399">ELIGIBLE</text></g>
      <g transform="translate(830 35)"><rect width="340" height="62" rx="10" fill="#0f172a" stroke="#7f1d1d"/><text x="18" y="27" class="label" fill="#fecaca">MODEL D</text><text x="18" y="47" class="mono" fill="#f87171">REJECT · exceeds_cost_ceiling</text></g>
      <text x="0" y="120" class="mono" fill="#64748b">Rejected candidates stay in RouteExplanation with an operator-readable detail.</text>
    </g>

    <path d="M594 389V415" stroke="#475569" class="flow"/>
    <g transform="translate(54 412)">
      <text x="0" y="18" class="label" fill="#64748b">03 · ORDER</text>
      <g transform="translate(0 35)"><rect width="230" height="76" rx="10" fill="#0f172a" stroke="#3730a3"/><text x="18" y="29" class="label" fill="#c7d2fe">SCORING</text><text x="18" y="54" class="mono" fill="#94a3b8">strategy + live signals</text></g>
      <path d="M230 73H270" stroke="url(#line)" class="flow"/>
      <g transform="translate(270 35)"><rect width="250" height="76" rx="10" fill="#0f172a" stroke="#0e7490"/><text x="18" y="29" class="label" fill="#cffafe">MODEL B · 0.92</text><text x="18" y="54" class="mono" fill="#22d3ee">PRIMARY</text></g>
      <path d="M520 73H560" stroke="url(#line)" class="flow"/>
      <g transform="translate(560 35)"><rect width="250" height="76" rx="10" fill="#0f172a" stroke="#4338ca"/><text x="18" y="29" class="label" fill="#e0e7ff">MODEL C · 0.84</text><text x="18" y="54" class="mono" fill="#818cf8">FALLBACK 01</text></g>
      <text x="844" y="65" class="mono" fill="#64748b">ordered remainder = fallback chain</text>
    </g>

    <path d="M594 558V584" stroke="#475569" class="flow"/>
    <g transform="translate(54 580)">
      <text x="0" y="18" class="label" fill="#64748b">04 · EXECUTE + RECORD</text>
      <g transform="translate(0 35)"><rect width="192" height="76" rx="10" fill="#0f172a" stroke="#7c2d12"/><text x="16" y="28" class="label" fill="#fed7aa">MODEL B</text><text x="16" y="53" class="mono" fill="#fb923c">TIMEOUT · attempt 1</text></g>
      <path d="M192 73H220" stroke="#fb923c" class="flow"/>
      <g transform="translate(220 35)"><rect width="192" height="76" rx="10" fill="#0f172a" stroke="#7c2d12"/><text x="16" y="28" class="label" fill="#fed7aa">RETRY B</text><text x="16" y="53" class="mono" fill="#fb923c">TIMEOUT · attempt 2</text></g>
      <path d="M412 73H440" stroke="#818cf8" class="flow"/>
      <g transform="translate(440 35)"><rect width="192" height="76" rx="10" fill="#0f172a" stroke="#065f46"/><text x="16" y="28" class="label" fill="#d1fae5">FALLBACK C</text><text x="16" y="53" class="mono" fill="#34d399">SUCCESS · attempt 3</text></g>
      <path d="M632 73H660" stroke="url(#line)" class="flow"/>
      <g transform="translate(660 35)"><rect width="510" height="76" rx="10" fill="#0b1324" stroke="#334155"/><text x="18" y="27" class="label" fill="#67e8f9">TRACE STORED</text><text x="18" y="52" class="mono" fill="#94a3b8">attempts · failure class · usage · cost · routing reason</text></g>
    </g>

    <circle r="5" fill="#f8fafc" filter="url(#glow)">
      <animateMotion dur="8s" repeatCount="indefinite" path="M192 179 H642 V282 H594 V447 H594 V653 H1135"/>
    </circle>
  </g>
</svg>
